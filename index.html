<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SINTA Journal Finder — Temukan Jurnal Akreditasi Terbaik</title>
  <meta name="description" content="Cari jurnal terakreditasi SINTA 1-6 dengan filter canggih. Temukan jurnal gratis, LOA cepat, sesuai bidang ilmu Anda.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
              600: '#475569',
            },
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .card-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-hover:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }
    
    .badge-sinta-1 { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .badge-sinta-2 { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .badge-sinta-3 { background: linear-gradient(135deg, #10b981, #059669); }
    .badge-sinta-4 { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
    .badge-sinta-5 { background: linear-gradient(135deg, #ec4899, #db2777); }
    .badge-sinta-6 { background: linear-gradient(135deg, #6b7280, #4b5563); }
    
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .dark .skeleton {
      background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      background-size: 200% 100%;
    }
    
    .filter-section {
      backdrop-filter: blur(10px);
    }
    
    .bookmark-active {
      animation: pulse 0.3s ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-dark-900 text-gray-800 dark:text-gray-200 min-h-screen">
  
  <!-- Header -->
  <header class="gradient-bg text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center py-6">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center backdrop-blur-sm">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
              <path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-2xl font-bold">SINTA Journal Finder</h1>
            <p class="text-sm text-white/80">Temukan jurnal terakreditasi terbaik</p>
          </div>
        </div>
        
        <!-- Search Bar -->
        <div class="flex-1 max-w-xl mx-8 hidden md:block">
          <div class="relative">
            <input
              type="text"
              id="searchInput"
              placeholder="Cari jurnal berdasarkan judul atau scope..."
              class="w-full px-5 py-3 rounded-xl bg-white/10 backdrop-blur-sm text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-white/50 border border-white/20"
            >
            <svg class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-white/60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
        </div>
        
        <!-- Dark Mode Toggle -->
        <button id="darkModeToggle" class="p-3 rounded-xl bg-white/10 backdrop-blur-sm hover:bg-white/20 transition-colors border border-white/20">
          <svg id="darkModeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>
      </div>
      
      <!-- Mobile Search -->
      <div class="md:hidden pb-4">
        <input
          type="text"
          id="searchInputMobile"
          placeholder="Cari jurnal..."
          class="w-full px-4 py-2 rounded-lg bg-white/10 backdrop-blur-sm text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-white/50 border border-white/20"
        >
      </div>
    </div>
  </header>

  <!-- Stats Banner -->
  <div class="bg-white dark:bg-dark-800 border-b border-gray-200 dark:border-dark-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="grid grid-cols-2 md:grid-cols-5 gap-4 text-center">
        <div>
          <div class="text-2xl font-bold text-primary-600 dark:text-primary-500" id="totalJournals">0</div>
          <div class="text-sm text-gray-600 dark:text-gray-400">Total Jurnal</div>
        </div>
        <div>
          <div class="text-2xl font-bold text-green-600 dark:text-green-500" id="freeJournals">0</div>
          <div class="text-sm text-gray-600 dark:text-gray-400">Jurnal Gratis</div>
        </div>
        <div>
          <div class="text-2xl font-bold text-orange-600 dark:text-orange-500" id="sinta1Count">0</div>
          <div class="text-sm text-gray-600 dark:text-gray-400">SINTA 1</div>
        </div>
        <div>
          <div class="text-2xl font-bold text-blue-600 dark:text-blue-500" id="sinta2Count">0</div>
          <div class="text-sm text-gray-600 dark:text-gray-400">SINTA 2</div>
        </div>
        <div>
          <button id="showBookmarksBtn" class="w-full px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-lg transition-colors">
            <span class="text-2xl" id="bookmarkCount">0</span>
            <div class="text-sm">⭐ Bookmark</div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Filters -->
    <div class="bg-white dark:bg-dark-800 rounded-2xl p-6 shadow-sm mb-8 filter-section border border-gray-200 dark:border-dark-700">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold flex items-center">
          <svg class="w-5 h-5 mr-2 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
          </svg>
          Filter Jurnal
        </h2>
        <button id="resetFilters" class="text-sm text-primary-600 hover:text-primary-700 font-medium">
          Reset Semua
        </button>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
        <!-- SINTA Level -->
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Level SINTA</label>
          <select id="sintaFilter" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-dark-700 border border-gray-200 dark:border-dark-600 focus:outline-none focus:ring-2 focus:ring-primary-500">
            <option value="">Semua Level</option>
            <option value="1">⭐ SINTA 1 (Scopus)</option>
            <option value="2">SINTA 2</option>
            <option value="3">SINTA 3</option>
            <option value="4">SINTA 4</option>
            <option value="5">SINTA 5</option>
            <option value="6">SINTA 6</option>
          </select>
        </div>
        
        <!-- APC -->
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Biaya Publikasi</label>
          <select id="apcFilter" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-dark-700 border border-gray-200 dark:border-dark-600 focus:outline-none focus:ring-2 focus:ring-primary-500">
            <option value="">Semua Biaya</option>
            <option value="0">🆓 Gratis</option>
            <option value="0-500000">Rp 0 - Rp 500rb</option>
            <option value="500000-1000000">Rp 500rb - Rp 1jt</option>
            <option value="1000000-2000000">Rp 1jt - Rp 2jt</option>
            <option value="2000000">> Rp 2jt</option>
          </select>
        </div>
        
        <!-- LOA Time -->
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Waktu LOA</label>
          <select id="loaFilter" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-dark-700 border border-gray-200 dark:border-dark-600 focus:outline-none focus:ring-2 focus:ring-primary-500">
            <option value="">Semua Waktu</option>
            <option value="1-2">⚡ 1-2 minggu</option>
            <option value="2-4">📅 2-4 minggu</option>
            <option value="4+">🐢 4+ minggu</option>
          </select>
        </div>
        
        <!-- Frekuensi -->
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Frekuensi Terbit</label>
          <select id="frequencyFilter" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-dark-700 border border-gray-200 dark:border-dark-600 focus:outline-none focus:ring-2 focus:ring-primary-500">
            <option value="">Semua Frekuensi</option>
            <option value="Bulanan">Bulanan</option>
            <option value="Kuartalan">Kuartalan (4x/thn)</option>
            <option value="Tri-bulanan">Tri-bulanan (3x/thn)</option>
            <option value="Semesteran">Semesteran (2x/thn)</option>
            <option value="Continuous">Continuous</option>
          </select>
        </div>
        
        <!-- Sorting -->
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Urutkan</label>
          <select id="sortFilter" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-dark-700 border border-gray-200 dark:border-dark-600 focus:outline-none focus:ring-2 focus:ring-primary-500">
            <option value="name-asc">Nama A-Z</option>
            <option value="name-desc">Nama Z-A</option>
            <option value="sinta-desc">SINTA Tertinggi</option>
            <option value="sinta-asc">SINTA Terendah</option>
            <option value="apc-asc">APC Terendah</option>
            <option value="apc-desc">APC Tertinggi</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Results Info -->
    <div class="flex items-center justify-between mb-6">
      <p class="text-gray-600 dark:text-gray-400">
        Menampilkan <span id="resultCount" class="font-semibold text-gray-900 dark:text-white">0</span> jurnal
      </p>
    </div>

    <!-- Journals List -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="journalsList">
      <!-- Loading skeleton -->
      <div class="bg-white dark:bg-dark-800 rounded-2xl p-6 shadow-sm">
        <div class="skeleton h-6 w-3/4 rounded mb-4"></div>
        <div class="skeleton h-4 w-full rounded mb-2"></div>
        <div class="skeleton h-4 w-2/3 rounded mb-4"></div>
        <div class="flex gap-2">
          <div class="skeleton h-6 w-16 rounded-full"></div>
          <div class="skeleton h-6 w-20 rounded-full"></div>
        </div>
      </div>
      <div class="bg-white dark:bg-dark-800 rounded-2xl p-6 shadow-sm">
        <div class="skeleton h-6 w-3/4 rounded mb-4"></div>
        <div class="skeleton h-4 w-full rounded mb-2"></div>
        <div class="skeleton h-4 w-2/3 rounded mb-4"></div>
        <div class="flex gap-2">
          <div class="skeleton h-6 w-16 rounded-full"></div>
          <div class="skeleton h-6 w-20 rounded-full"></div>
        </div>
      </div>
      <div class="bg-white dark:bg-dark-800 rounded-2xl p-6 shadow-sm">
        <div class="skeleton h-6 w-3/4 rounded mb-4"></div>
        <div class="skeleton h-4 w-full rounded mb-2"></div>
        <div class="skeleton h-4 w-2/3 rounded mb-4"></div>
        <div class="flex gap-2">
          <div class="skeleton h-6 w-16 rounded-full"></div>
          <div class="skeleton h-6 w-20 rounded-full"></div>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div class="flex justify-center items-center mt-8 space-x-2" id="pagination">
      <button id="prevPage" class="px-4 py-2 bg-white dark:bg-dark-800 border border-gray-200 dark:border-dark-700 rounded-xl hover:bg-gray-50 dark:hover:bg-dark-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <div id="pageNumbers" class="flex space-x-2"></div>
      <button id="nextPage" class="px-4 py-2 bg-white dark:bg-dark-800 border border-gray-200 dark:border-dark-700 rounded-xl hover:bg-gray-50 dark:hover:bg-dark-700 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white dark:bg-dark-800 border-t border-gray-200 dark:border-dark-700 mt-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="text-center text-gray-600 dark:text-gray-400">
        <p class="text-sm">© 2025 SINTA Journal Finder. Data bersumber dari SINTA Kemdikbud.</p>
        <p class="text-xs mt-2">Disclaimer: Informasi dapat berubah. Selalu verifikasi di website resmi SINTA.</p>
      </div>
    </div>
  </footer>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
